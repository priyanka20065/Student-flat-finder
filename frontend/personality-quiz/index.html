<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personality Quiz</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="nav">
      <a href="/" class="brand">Student Flat Finder</a>
      <nav>
        <a data-nav href="/">Home</a>
        <a data-nav href="/browse">Browse</a>
        <a data-nav href="/personality-quiz">Quiz</a>
        <a class="btn btn-primary small-btn" href="/login">Login</a>
        <a class="btn btn-secondary small-btn" href="/signup">Sign Up</a>
      </nav>
    </header>

    <section class="page-intro compact-intro">
      <div class="page-intro-inner">
        <h1>Personality Quiz</h1>
        <p>This quiz helps AI match rooms and roommates based on your lifestyle and interests.</p>
      </div>
    </section>

    <main class="page">


      <form id="quizForm" class="simple-form">
        <label>Preferred Monthly Rent Range (₹2,000 - ₹50,000)
          <input name="budget" type="range" min="2000" max="50000" step="500" value="15000" oninput="this.nextElementSibling.value = this.value" />
          <output style="margin-left:10px; color:#38bdf8; font-weight:600;">15000</output>
        </label>

        <label>Room Type *</label>
        <div class="choice-card">
          <label style="margin-right:1.5em;">
            <input type="radio" name="roomType" value="room-only" checked /> Single Room Only
          </label>
          <label>
            <input type="radio" name="roomType" value="shared-room" /> Shared Room (multiple students)
          </label>
        </div>

        <label>Amenities (select all that apply)</label>
        <div class="amenities-checkboxes">
          <label><input type="checkbox" name="amenities" value="WiFi" /> WiFi</label>
          <label><input type="checkbox" name="amenities" value="Parking" /> Parking</label>
          <label><input type="checkbox" name="amenities" value="Laundry" /> Laundry</label>
          <label><input type="checkbox" name="amenities" value="Kitchen" /> Kitchen</label>
          <label><input type="checkbox" name="amenities" value="Study Room" /> Study Room</label>
          <label><input type="checkbox" name="amenities" value="Gym" /> Gym</label>
          <label><input type="checkbox" name="amenities" value="Swimming Pool" /> Swimming Pool</label>
          <label><input type="checkbox" name="amenities" value="Security" /> Security</label>
          <label><input type="checkbox" name="amenities" value="Furnished" /> Furnished</label>
          <label><input type="checkbox" name="amenities" value="Air Conditioning" /> Air Conditioning</label>
          <label><input type="checkbox" name="amenities" value="Balcony" /> Balcony</label>
          <label><input type="checkbox" name="amenities" value="Garden" /> Garden</label>
        </div>

        <label>Any specific house rules or preferences? (optional)
          <textarea name="houseRules" rows="3" placeholder="Any specific rules or preferences..."></textarea>
        </label>

        <button class="btn btn-primary" type="submit">Run AI Matching</button>
      </form>

      <p id="quizStatus" class="status-text"></p>
      <section id="recommendations" class="card-grid"></section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/quiz.js"></script>
  </body>
</html>
