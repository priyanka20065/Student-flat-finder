<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roommate Profile</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="profile-main">
    <div class="profile-card" id="profileCard">
      <h1>Roommate Profile</h1>
      <div id="profileContent">Loading...</div>
      <a href="/browse" class="btn btn-secondary" style="margin-top:2rem;">Back to Browse</a>
    </div>
  </main>
  <script src="/js/roommate-profile.js"></script>
  <style>
    .profile-main { display: flex; justify-content: center; align-items: flex-start; min-height: 90vh; background: none; }
    .profile-card {
      background: rgba(30, 34, 54, 0.98);
      border-radius: 18px;
      box-shadow: 0 4px 32px 0 rgba(0,0,0,0.18);
      padding: 2.5rem 2.5rem 2rem 2.5rem;
      max-width: 520px;
      width: 100%;
      margin-top: 3rem;
      position: relative;
    }
    #profileContent {
      margin-top: 1.5rem;
      color: #e0e6ff;
      font-size: 1.08rem;
    }
    .profile-section {
      margin-bottom: 1.2rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid #2a2e47;
    }
    .profile-section:last-child { border-bottom: none; }
    .profile-label {
      color: #bfcfff;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
    }
    .profile-value { color: #fff; font-weight: 400; }
    .profile-badge {
      display: inline-block;
      background: #3a4066;
      color: #bfcfff;
      border-radius: 8px;
      padding: 0.1em 0.7em;
      font-size: 0.95em;
      margin-left: 0.5em;
    }
    .chip-list { margin-top: 0.5rem; }
    .chip { background: #4f8cff; color: #fff; border-radius: 6px; padding: 0.2em 0.7em; margin-right: 0.4em; font-size: 0.95em; display: inline-block; }
    .icon {
      width: 1.1em;
      height: 1.1em;
      vertical-align: middle;
      margin-right: 0.2em;
      opacity: 0.8;
    }
  </style>
</body>
</html>
